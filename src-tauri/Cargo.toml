[package]
name = "diff-trek"
version = "0.1.0"
description = "A fast continuous Git diff viewer"
authors = ["Diff Trek"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diff_trek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The operating system's preferred languages. Small, no dependencies of its own
# on macOS beyond the system frameworks; it is what `tauri-plugin-os` uses.
sys-locale = "0.3"
difftrek-extension-api = { path = "../crates/extension-api" }
# Hands a second launch's arguments to the running process, so every window
# lives in one process and macOS shows one Dock icon for them all. Held at 2.4:
# 2.5 needs tauri 2.12, and the tauri crate and @tauri-apps/api have to move
# together (`tauri build` refuses a mismatch), which is a separate upgrade.
tauri-plugin-single-instance = "~2.4"

# One line per extension in `extensions/`, written by `scripts/extensions.mjs`
# (`pnpm extensions`). They have to be direct dependencies: Tauri finds a
# plugin's permissions through its build script's `links` metadata, which
# Cargo only passes one level up. Empty in the community build.
# BEGIN EXTENSIONS
# END EXTENSIONS

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
